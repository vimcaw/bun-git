name: Publish Docker Image

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # Rebuild every Monday to pick up latest Bun releases

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Bun version from Docker Hub registry
        run: |
          # Fetch tag list, filter x.x.x-alpine format, strip -alpine suffix
          BUN_VERSION=$(curl -s "https://hub.docker.com/v2/repositories/oven/bun/tags/?page_size=50" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-alpine$' \
            | head -1 \
            | sed 's/-alpine//')
          BUN_MAJOR_VERSION=$(echo $BUN_VERSION | cut -d. -f1)
          echo "BUN_VERSION=$BUN_VERSION" >> $GITHUB_ENV
          echo "BUN_MAJOR_VERSION=$BUN_MAJOR_VERSION" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            vimcaw/bun-git:latest
            vimcaw/bun-git:bun${{ env.BUN_MAJOR_VERSION }}-alpine
            vimcaw/bun-git:bun${{ env.BUN_VERSION }}-alpine

      - name: Verify image
        run: |
          docker run --rm vimcaw/bun-git bun --version
          docker run --rm vimcaw/bun-git git --version
