name: Publish Docker Image

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # Rebuild every Monday to pick up latest Bun releases

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Bun version from Docker Hub registry
        run: |
          TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:oven/bun:pull" | jq -r '.token')
          
          # oven/bun:alpine is multi-platform, get amd64 manifest digest first
          AMD64_DIGEST=$(curl -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" "https://registry-1.docker.io/v2/oven/bun/manifests/alpine" | jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest')
          
          # Get config digest from amd64 manifest
          CONFIG_DIGEST=$(curl -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.docker.distribution.manifest.v2+json" "https://registry-1.docker.io/v2/oven/bun/manifests/$AMD64_DIGEST" | jq -r '.config.digest')
          
          # Get BUN_VERSION from image config
          BUN_VERSION=$(curl -s -H "Authorization: Bearer $TOKEN" "https://registry-1.docker.io/v2/oven/bun/blobs/$CONFIG_DIGEST" | jq -r '.config.Env[] | select(startswith("BUN_VERSION=")) | split("=")[1]')
          
          BUN_MAJOR_VERSION=$(echo $BUN_VERSION | cut -d. -f1)
          echo "BUN_VERSION=$BUN_VERSION" >> $GITHUB_ENV
          echo "BUN_MAJOR_VERSION=$BUN_MAJOR_VERSION" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            vimcaw/bun-git:latest
            vimcaw/bun-git:bun${{ env.BUN_MAJOR_VERSION }}-alpine
            vimcaw/bun-git:bun${{ env.BUN_VERSION }}-alpine

      - name: Verify image
        run: |
          docker run --rm vimcaw/bun-git bun --version
          docker run --rm vimcaw/bun-git git --version
